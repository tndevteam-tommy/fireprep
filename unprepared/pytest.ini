[pytest]
testpaths = tests
markers =
    display: needs an OpenGL-capable display (run under xvfb-run on headless Linux)
    parity: compares the refactored game against the frozen original prototype
    regression: golden-file regression of scripted scenarios
    slow: takes more than a few seconds
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
